// ─── 音声読み上げ ─────────────────────────────────────────────
function speak(text, rate = 0.85) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "ja-JP"; utter.rate = rate; utter.pitch = 1.1;
  const voices = window.speechSynthesis.getVoices();
  const jaVoice = voices.find(v => v.lang.startsWith("ja"));
  if (jaVoice) utter.voice = jaVoice;
  window.speechSynthesis.speak(utter);
}

function speakWithPauses(q) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const voices = window.speechSynthesis.getVoices();
  const jaVoice = voices.find(v => v.lang.startsWith("ja"));
  const makeUtter = (text, rate=0.85) => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang="ja-JP"; u.rate=rate; u.pitch=1.1;
    if(jaVoice) u.voice=jaVoice;
    return u;
  };
  // sentence: [word1, blank1, word2, blank2, verb]
  // read word1, pause, word2, pause, verb
  const parts = q.sentence.filter((_, i) => i % 2 === 0); // words only
  if (parts.length === 0) return;
  const speak_sequence = (idx) => {
    if (idx >= parts.length) return;
    const u = makeUtter(parts[idx]);
    u.onend = () => setTimeout(() => speak_sequence(idx+1), idx < parts.length-1 ? 700 : 0);
    window.speechSynthesis.speak(u);
  };
  speak_sequence(0);
}

// 選択肢のルールは choices シートから読み込む（読み込み前のフォールバック用に初期値を持たせておく）
let CHOICES_RULES = [
  { particle:"が", category:"", choices:["が","に","で","も"] },
  { particle:"を", category:"", choices:["を","も","へ","に"] },
  { particle:"は", category:"", choices:["は","に","で","も"] },
  { particle:"に", category:"", choices:["に","で","も","と"] },
  { particle:"で", category:"", choices:["で","は","も","へ"] },
  { particle:"と", category:"", choices:["と","も","へ","は"] },
  { particle:"を", category:"D", choices:["を","へ","に","と"] },
  { particle:"を", category:"F", choices:["を","へ","に","と"] },
];

// 正解の助詞・カテゴリーから、選択肢の候補を決める
// （カテゴリー専用ルールがあればそれを優先し、なければ共通ルールを使う）
function getChoicesFor(answer, catId) {
  const specific = CHOICES_RULES.find(r => r.particle===answer && r.category===catId);
  if (specific) return specific.choices;
  const general = CHOICES_RULES.find(r => r.particle===answer && r.category==="");
  if (general) return general.choices;
  return ["が","を","に","で"];
}

// 助詞とカテゴリーから「だれに／なにを」などの問いかけ言葉を決める
function getRoleQuestion(particle, catId) {
  switch (particle) {
    case "を": return "なにを";
    case "が": return "だれが";
    case "で": return "どこで";
    case "と": return "なにと";
    case "に": return catId === "F" ? "どこに" : "だれに";
    default:   return "";
  }
}

// 問題文（動詞）とフェーズから、ヒントの文章を組み立てる
function buildHintText(q, phase) {
  if (!q) return "";
  const particle = phase === 1 ? q.answer1 : q.answer2;
  const verbRaw = q.sentence[q.sentence.length - 1] || "";
  const verb = verbRaw.replace(/。$/, "");
  const role = getRoleQuestion(particle, q.cat);
  return `${role}　${verb}か？`;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildSheetCsvUrl(gid) {

// fetch()でのCSV取得はGoogle側がCORSヘッダーを返さないため、
// ブラウザにブロックされて失敗することがある（"Failed to fetch"）。
// そのためscriptタグ経由のJSONP方式（Google Visualization API）で取得する。
function fetchSheetViaJsonp(gid, timeoutMs = 10000) {
  return new Promise((resolve, reject) => {
    if (!SHEET_CONFIG.SHEET_ID || gid === "" || gid === undefined) {
      reject(new Error("no sheet id"));
      return;
    }
    const cbName = "__sheetJsonpCb_" + gid + "_" + Date.now();
    let done = false;
    const cleanup = () => {
      done = true;
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      clearTimeout(timer);
    };
    window[cbName] = function (json) {
      if (done) return;
      cleanup();
      resolve(json);
    };
    const script = document.createElement("script");
    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_CONFIG.SHEET_ID}/gviz/tq?gid=${gid}&tqx=out:json;responseHandler=${cbName}&_=${Date.now()}`;
    script.onerror = () => {
      if (done) return;
      cleanup();
      reject(new Error("JSONPスクリプトの読み込みに失敗しました"));
    };
    const timer = setTimeout(() => {
      if (done) return;
      cleanup();
      reject(new Error("JSONPがタイムアウトしました"));
    }, timeoutMs);
    document.body.appendChild(script);
  });
}

function csvEscapeField(value) {
  const s = value === null || value === undefined ? "" : String(value);
  if (s.includes(",") || s.includes('"') || s.includes("\n")) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

// Google Visualization APIが返すテーブル形式（table.cols / table.rows）を
// 既存のparseCsv()がそのまま読めるCSV文字列に変換する
function gvizTableToCsv(table) {
  if (!table || !table.cols) return "";
  const headers = table.cols.map(c => (c && c.label) ? c.label : "");
  const lines = [headers.map(csvEscapeField).join(",")];
  (table.rows || []).forEach(row => {
    const cells = (row.c || []).map(cell => {
      if (!cell) return "";
      const val = (cell.f !== undefined && cell.f !== null) ? cell.f : cell.v;
      return val === null || val === undefined ? "" : val;
    });
    lines.push(cells.map(csvEscapeField).join(","));
  });
  return lines.join("\n");
}

// ごく簡易的なCSVパーサー（ダブルクォートで囲まれた中のカンマに対応）
function parseCsv(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field = "";
        if (row.length > 1 || row[0] !== "") rows.push(row);
        row = [];
      } else field += c;
    }
  }
  if (field !== "" || row.length > 0) { row.push(field); rows.push(row); }
  if (rows.length === 0) return [];
  const header = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => {
    const obj = {};
    header.forEach((h, i) => { obj[h] = (r[i] || "").trim(); });
    return obj;
  });
}

function buildAllQuestionsFromRows(rows) {
  const grouped = {};
  rows.forEach(row => {
    const cat = (row.category || "").trim();
    if (!cat) return;
    (grouped[cat] = grouped[cat] || []).push(row);
  });
  const all = {};
  Object.keys(grouped).forEach(cat => {
    const list = [];
    grouped[cat].forEach((row, i) => {
      const w1 = (row.word1 || "").trim();
      const w2 = (row.word2 || "").trim();
      const verb = (row.verb || "").trim();
      const p1 = (row.particle1 || "").trim();
      const p2 = (row.particle2 || "").trim();
      const image = (row.image || "").trim();
      const reverse = (row.reverse || "yes").trim().toLowerCase() !== "no";
      list.push({
        id: `${cat}_${i}_a`,
        sentence: [w1, "__1__", w2, "__2__", verb],
        blank1: 1, blank2: 3,
        answer1: p1, answer2: p2,
        image, cat,
      });
      if (reverse) {
        list.push({
          id: `${cat}_${i}_b`,
          sentence: [w2, "__1__", w1, "__2__", verb],
          blank1: 1, blank2: 3,
          answer1: p2, answer2: p1,
          image, cat,
        });
      }
    });
    all[cat] = list;
  });
  return all;
}

function buildChoicesRulesFromRows(rows) {
  return rows
    .map(row => ({
      particle: (row.particle || "").trim(),
      category: (row.category || "").trim(),
      choices: (row.choices || "").split(",").map(s => s.trim()).filter(Boolean),
    }))
    .filter(r => r.particle && r.choices.length > 0);
}

async function fetchCsvOrFallback(gid, fallbackText) {
  if (gid === "" || gid === undefined || gid === null) return fallbackText;
  // 方法1: JSONP（Google Visualization API）。CORSの影響を受けないので基本こちらが使われる。
  try {
    const json = await fetchSheetViaJsonp(gid);
    const text = gvizTableToCsv(json.table);
    if (!text || !text.trim()) throw new Error("empty response (jsonp)");
    return text;
  } catch (e1) {
    console.warn("JSONPでのスプレッドシート取得に失敗。fetch()で再試行します:", e1);
  }
  // 方法2: 通常のfetch()（環境によってはこちらが通る場合もあるので念のため試す）
  try {
    const url = buildSheetCsvUrl(gid);
    const bustedUrl = url + (url.includes("?") ? "&" : "?") + "cachebust=" + Date.now();
    const res = await fetch(bustedUrl, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    if (!text || !text.trim()) throw new Error("empty response");
    return text;
  } catch (e2) {
    console.warn("スプレッドシートの取得に失敗したため、内蔵データを使用します:", e2);
    return fallbackText;
  }
}

// アプリ起動時に一度だけ呼び出し、問題データと選択肢ルールを組み立てる
async function loadGameData() {
  const [qText, cText] = await Promise.all([
    fetchCsvOrFallback(SHEET_CONFIG.QUESTIONS_GID, DEFAULT_QUESTIONS_CSV),
    fetchCsvOrFallback(SHEET_CONFIG.CHOICES_GID, DEFAULT_CHOICES_CSV),
  ]);

  const qRows = parseCsv(qText);
  const cRows = parseCsv(cText);

  ALL_QUESTIONS = buildAllQuestionsFromRows(qRows);
  CHOICES_RULES = buildChoicesRulesFromRows(cRows);

  QUESTION_LOOKUP = {};
  Object.values(ALL_QUESTIONS).flat().forEach(q => { QUESTION_LOOKUP[q.id] = q; });

  return { questionCount: Object.values(ALL_QUESTIONS).flat().length };
}

// image列が絵文字か画像URL（PNGなど）かを見分けて表示する
function isImageUrl(str) {
  if (!str) return false;
  const s = String(str).trim();
  return /^https?:\/\//i.test(s) || /^data:image\//i.test(s) || /\.(png|jpe?g|gif|webp|svg)(\?.*)?$/i.test(s);
}

function QuestionIcon({ src, size = 60 }) {
  const [attempt, setAttempt] = useState(0); // 0=元のパス, 1=imagesフォルダを試す, 2=あきらめる
  useEffect(() => { setAttempt(0); }, [src]);
  if (!isImageUrl(src)) {
    return <span style={{ fontSize:size, lineHeight:1 }}>{src}</span>;
  }
  if (attempt >= 2) return null;
  const baseName = src.replace(/^images\//, "");
  const resolvedSrc = attempt === 0 ? src : ("images/" + baseName);
  return (
    <img
      src={resolvedSrc}
      alt=""
      style={{ width:size, height:size, objectFit:"contain", display:"inline-block", verticalAlign:"middle" }}
      onError={() => setAttempt(a => a + 1)}
    />
  );
}

// ─── クイズ画面 ───────────────────────────────────────────────
function QuizScreen({ questions, mode, onFinish }) {
  const [current, setCurrent]     = useState(0);
  const [phase, setPhase]         = useState(1);
  const [sel1, setSel1]           = useState(null);
  const [sel2, setSel2]           = useState(null);
  const [score, setScore]         = useState(0);
  const [shake, setShake]         = useState(false);
  const [showHanamaru, setShowHanamaru] = useState(false);
  const [sessionLog, setSessionLog] = useState([]);
  const [voiceOn, setVoiceOn]     = useState(true);
  const [showHint, setShowHint]   = useState(false);
  const speakingRef               = useRef(false);

  const q = questions[current];
  const modeColor = mode==="mixed"?"#667eea":(CAT_CONFIG[mode]?.color||"#667eea");
  const modeLabel = mode==="mixed"?"まじり":CAT_CONFIG[mode]?.label||"";

  const correct1 = sel1 === q?.answer1;
  const correct2 = sel2 === q?.answer2;
  const bothCorrect = correct1 && correct2;

  const shuffledChoices1 = useMemo(()=>shuffle(getChoicesFor(q?.answer1, q?.cat)),[current]);
  const shuffledChoices2 = useMemo(()=>shuffle(getChoicesFor(q?.answer2, q?.cat)),[current, phase]);

  useEffect(()=>{
    speakingRef.current = false;
    if(voiceOn && q){
      const doSpeak = ()=>speakWithPauses(q);
      if(window.speechSynthesis.getVoices().length>0) doSpeak();
      else window.speechSynthesis.onvoiceschanged = doSpeak;
    }
    setShowHint(false);
    return ()=>{ if(!speakingRef.current) window.speechSynthesis.cancel(); };
  }, [current, voiceOn]);

  function handleChoice(choice) {
    if (phase === 1) {
      setSel1(choice);
      if (choice === q.answer1) {
        setPhase(2);
      } else {
        setShake(true);
        setTimeout(()=>setShake(false),500);
        if(voiceOn) setTimeout(()=>speak(`こたえは「${q.answer1}」だよ`,0.8),300);
        setShowHint(true);
        setTimeout(()=>{ setSel1(null); }, 1000);
      }
    } else if (phase === 2) {
      setSel2(choice);
      if (choice === q.answer2) {
        setPhase(3);
        setScore(s=>s+1);
        setShowHanamaru(true);
        setTimeout(()=>setShowHanamaru(false),1200);
        if(voiceOn){
          const fullText = q.sentence.map((p,i)=>
            i===q.blank1?q.answer1:i===q.blank2?q.answer2:p
          ).join("");
          setTimeout(()=>{
            const voices=window.speechSynthesis.getVoices();
            const jaVoice=voices.find(v=>v.lang.startsWith("ja"));
            const makeU=(text,rate=0.85)=>{
              const u=new SpeechSynthesisUtterance(text);
              u.lang="ja-JP";u.rate=rate;u.pitch=1.1;
              if(jaVoice)u.voice=jaVoice;
              return u;
            };
            speakingRef.current=true;
            window.speechSynthesis.cancel();
            const u1=makeU(fullText);
            u1.onend=()=>setTimeout(()=>{
              const u2=makeU("せいかい！すごい！",0.9);
              u2.onend=()=>{speakingRef.current=false;};
              window.speechSynthesis.speak(u2);
            },300);
            window.speechSynthesis.speak(u1);
          },200);
        }
        setSessionLog(prev=>[...prev,{id:q.id,correct:true}]);
      } else {
        setShake(true);
        setTimeout(()=>setShake(false),500);
        if(voiceOn) setTimeout(()=>speak(`こたえは「${q.answer2}」だよ`,0.8),300);
        setShowHint(true);
        setSessionLog(prev=>[...prev,{id:q.id,correct:false}]);
        setTimeout(()=>{ setSel2(null); }, 1000);
      }
    }
  }

  async function handleNext() {
    if(current+1>=questions.length){
      const h=await loadHistory();
      const now=new Date();
      const dateStr=`${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,"0")}`;
      h.sessions.push({mode,score,total:questions.length,date:dateStr});
      if(h.sessions.length>50)h.sessions=h.sessions.slice(-50);
      sessionLog.forEach(({id,correct})=>{
        if(!h.questionStats[id])h.questionStats[id]={correct:0,total:0};
        h.questionStats[id].total++;
        if(correct)h.questionStats[id].correct++;
      });
      await saveHistory(h);
      onFinish(score,questions.length);
    } else {
      setCurrent(c=>c+1);
      setPhase(1);setSel1(null);setSel2(null);setShowHint(false);
    }
  }

  if(!q) return null;

  const renderSentence = ()=>{
    return q.sentence.map((part,i)=>{
      if(i===q.blank1){
        const color = sel1?(sel1===q.answer1?"#00B5A3":"#FF6B6B"):"#ccc";
        return <span key={i} style={{ display:"inline-block",minWidth:44,borderBottom:`4px solid ${color}`,textAlign:"center",fontSize:26,fontWeight:"bold",color:sel1?(sel1===q.answer1?"#00B5A3":"#FF6B6B"):"#aaa",margin:"0 2px" }}>{sel1||"　"}</span>;
      }
      if(i===q.blank2){
        const color = sel2?(sel2===q.answer2?"#00B5A3":"#FF6B6B"):phase>=2?"#ccc":"#eee";
        return <span key={i} style={{ display:"inline-block",minWidth:44,borderBottom:`4px solid ${color}`,textAlign:"center",fontSize:26,fontWeight:"bold",color:sel2?(sel2===q.answer2?"#00B5A3":"#FF6B6B"):"#aaa",margin:"0 2px" }}>{sel2||"　"}</span>;
      }
      return <span key={i} style={{ fontSize:26,fontWeight:"bold",color:"#2d2d2d" }}>{part}</span>;
    });
  };

  const currentChoices = phase===1 ? shuffledChoices1 : shuffledChoices2;
  const currentAnswer  = phase===1 ? q.answer1 : q.answer2;
  const currentSel     = phase===1 ? sel1 : sel2;

  return (
    <div style={S.root}>
      <style>{globalCSS}</style>
      <Hanamaru visible={showHanamaru}/>
      <div style={S.progressWrap}>
        <div style={{...S.progressBar,width:`${((current+(phase===3?1:0))/questions.length)*100}%`,background:modeColor}}/>
      </div>
      <div style={{...S.card,animation:shake?"shake 0.4s ease":"none"}}>
        <div style={S.questionHeader}>
          <span style={{ background:"#f5f0ff",color:modeColor,fontWeight:"bold",fontSize:13,padding:"3px 10px",borderRadius:20,border:`1.5px solid ${modeColor}` }}>
            {modeLabel}
          </span>
          <div style={{ display:"flex",gap:8,alignItems:"center" }}>
            <span style={S.qNum}>{current+1} / {questions.length}</span>
            <span style={S.scoreSmall}>⭐ {score}</span>
            <button onClick={()=>setVoiceOn(v=>!v)} style={{ background:voiceOn?"#e8f4ff":"#f0f0f0",border:"none",borderRadius:20,padding:"4px 10px",fontSize:18,cursor:"pointer",color:voiceOn?"#4A9EDB":"#bbb" }}>
              {voiceOn?"🔊":"🔇"}
            </button>
          </div>
        </div>

        <div style={{ textAlign:"center",marginBottom:10 }}><QuestionIcon src={q.image} size={60}/></div>

        <div style={{ display:"flex",justifyContent:"center",gap:8,marginBottom:10 }}>
          <span style={{ fontSize:13,fontWeight:"bold",padding:"3px 12px",borderRadius:20,background:phase>=1?"#00B5A3":"#eee",color:phase>=1?"#fff":"#aaa" }}>①　1つめ</span>
          <span style={{ fontSize:13,fontWeight:"bold",padding:"3px 12px",borderRadius:20,background:phase>=2?"#00B5A3":"#eee",color:phase>=2?"#fff":"#aaa" }}>②　2つめ</span>
        </div>

        <div style={S.sentenceBox}>{renderSentence()}</div>

        <div style={{ textAlign:"center",marginBottom:8 }}>
          <button onClick={()=>speakWithPauses(q)} style={{ background:"none",border:"2px solid #e0e0e0",borderRadius:20,padding:"5px 16px",fontSize:13,color:"#888",cursor:"pointer",display:"inline-flex",alignItems:"center",gap:4 }}>
            🔁 もういちど　きく
          </button>
        </div>

        {(mode!=="mixed" || showHint) && (
          <div style={S.hintBox}>
            💡 {buildHintText(q, phase)}
          </div>
        )}

        {phase < 3 && (
          <div style={S.choicesGrid}>
            {currentChoices.map(choice=>{
              let bg="#fff",border="3px solid #e0e0e0",col="#333";
              return (
                <button key={choice} onClick={()=>handleChoice(choice)} style={{
                  ...S.choiceBtn,background:bg,border,color:col,cursor:"pointer",
                }}>{choice}</button>
              );
            })}
          </div>
        )}

        {phase===3 && (
          <div style={{ textAlign:"center",marginTop:16 }}>
            <p style={{ fontSize:22,fontWeight:"bold",color:"#00B5A3",marginBottom:12 }}>🎉 せいかい！</p>
            <button style={{...S.nextBtn,background:modeColor}} onClick={handleNext}>
              {current+1>=questions.length?"けっかをみる！":"つぎへ →"}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

                const good = s.total>0 && s.score/s.total>=0.8;
                return (
                  <div key={i} style={S.historyRow}>
                    <span style={{...S.historyBadge,color,borderColor:color}}>{label}</span>
                    <span style={S.historyDate}>{s.date}</span>
                    <span style={{...S.historyScore,color:good?"#00B5A3":"#E8654A"}}>{s.score} / {s.total}</span>
                  </div>
                );
              })}
            </div>

            {weakList.length>0 && (
              <>
                <p style={S.sectionTitle}>💪 にがてな　もんだい</p>
                <div style={{ display:"flex",flexDirection:"column",gap:8,marginBottom:18 }}>
                  {weakList.map(w=>{
                    const q = QUESTION_LOOKUP[w.id];
                    const text = q.sentence.map((part,i)=> i===q.blank1?q.answer1:i===q.blank2?q.answer2:part).join("");
                    const cfg = CAT_CONFIG[q.cat];
                    return (
                      <div key={w.id} style={S.weakRow}>
                        <span style={{ display:"inline-flex",alignItems:"center" }}><QuestionIcon src={q.image} size={24}/></span>
                        <div style={{ flex:1,minWidth:0 }}>
                          <div style={{ fontSize:14,fontWeight:"bold",color:"#444" }}>{text}</div>
                          <div style={{ fontSize:11,color:"#aaa",marginTop:2 }}>
                            {cfg?.label} ・ せいかい {w.correct} / {w.total} かい
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </>
            )}

            <button onClick={handleReset} style={S.resetBtn}>きろくを　リセット</button>
          </>
        )}
      </div>
    </div>
  );
}

// ─── メインアプリ ─────────────────────────────────────────────
function App() {
  const [screen, setScreen]   = useState("title");
  const [mode, setMode]       = useState(null);
  const [questions, setQuestions] = useState([]);
  const [lastScore, setLastScore] = useState(0);
  const [lastTotal, setLastTotal] = useState(10);
  const [dataState, setDataState] = useState("loading"); // loading | ready | error

  useEffect(() => {
    let mounted = true;
    (async () => {
      try {
        await loadGameData();
        if (mounted) setDataState("ready");
      } catch (e) {
        console.error("問題データの読み込みに失敗しました", e);
        if (mounted) setDataState("error");
      }
    })();
    return () => { mounted = false; };
  }, []);

  function buildQuestions(selectedMode) {
    if (selectedMode==="mixed") {
      const all = Object.values(ALL_QUESTIONS).flat();
      return shuffle(all).slice(0,10);
    }
    return shuffle(ALL_QUESTIONS[selectedMode]||[]).slice(0,10);
  }

  function handleStart(selectedMode) {
    setMode(selectedMode);
    setQuestions(buildQuestions(selectedMode));
    setScreen("quiz");
  }

  function handleFinish(score, total) {
    setLastScore(score); setLastTotal(total); setScreen("result");
  }

  if (dataState === "loading") {
    return (
      <div style={S.root}>
        <style>{globalCSS}</style>
        <div style={S.card}>
          <div style={{ fontSize:56,textAlign:"center",marginBottom:8 }}>📝</div>
          <p style={{ textAlign:"center",color:"#888",padding:"20px 0" }}>もんだいを　よみこみちゅう...</p>
        </div>
      </div>
    );
  }

  if (dataState === "error") {
    return (
      <div style={S.root}>
        <style>{globalCSS}</style>
        <div style={S.card}>
          <div style={{ fontSize:56,textAlign:"center",marginBottom:8 }}>😢</div>
          <p style={{ textAlign:"center",color:"#E8654A",padding:"10px 0",lineHeight:1.7 }}>
            もんだいの　よみこみに　しっぱいしました。<br/>じかんを　おいて　もう　いちど　ためしてください。
          </p>
          <button style={{...S.startBtn,background:"#667eea"}} onClick={()=>{ setDataState("loading"); loadGameData().then(()=>setDataState("ready")).catch(()=>setDataState("error")); }}>
            もう　いちど　よみこむ
          </button>
        </div>
      </div>
    );
  }

  return (
    <>
      {screen==="title"  && <TitleScreen onStart={handleStart} onRecords={()=>setScreen("records")}/>}
      {screen==="quiz"   && <QuizScreen questions={questions} mode={mode} onFinish={handleFinish}/>}
      {screen==="result" && <ResultScreen score={lastScore} total={lastTotal} mode={mode}
          onRetry={()=>{ setQuestions(buildQuestions(mode)); setScreen("quiz"); }}
          onHome={()=>setScreen("title")}/>}
      {screen==="records" && <RecordsScreen onHome={()=>setScreen("title")}/>}
    </>
  );
}

  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  @keyframes hanamaruPop{0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.15) rotate(5deg);opacity:1}80%{transform:scale(0.95) rotate(-2deg)}100%{transform:scale(1) rotate(0deg);opacity:1}}
  @keyframes pop{0%{transform:scale(0);opacity:0}80%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
  *{box-sizing:border-box}body{margin:0}
`;
